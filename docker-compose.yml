version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mentiq_db
    environment:
      POSTGRES_DB: mentiq_db
      POSTGRES_USER: mentiq_user
      POSTGRES_PASSWORD: mentiq_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentiq_user -d mentiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mentiq_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mentiq_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "dev-secret-key-mentiq"
      DATABASE_URL: "postgres://mentiq_user:mentiq_password@db:5432/mentiq_db"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8081"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mentiq_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app/backend
    environment:
      DEBUG: "True"
      SECRET_KEY: "dev-secret-key-mentiq"
      DATABASE_URL: "postgres://mentiq_user:mentiq_password@db:5432/mentiq_db"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    depends_on:
      - backend
      - redis

  frontendweb:
    build:
      context: ./frontendweb
      dockerfile: Dockerfile
    container_name: mentiq_frontendweb
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000/api/v1/"
    depends_on:
      - backend

volumes:
  postgres_data:
